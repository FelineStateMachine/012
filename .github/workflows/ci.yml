name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            oracle/go.sum
      - run: go vet ./...
      - run: make build
      - run: make test
      - run: make oracle

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: e2e/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/cache@v4
        with:
          path: .deps/ghostty
          key: libghostty-${{ runner.os }}-${{ hashFiles('Makefile') }}
      - run: sudo apt-get install -y pkg-config
      - run: make e2e
